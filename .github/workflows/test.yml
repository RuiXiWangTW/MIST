name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CPU environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.7' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]'
      - name: Static checks
        run: |
          ruff check --output-format=github src scripts tests
          bash -n scripts/train_recipe.sh scripts/train_ddp.sh scripts/evaluate_ddp.sh
      - name: Tests
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: pytest -q
      - name: Build and inspect wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          mist-download --list
